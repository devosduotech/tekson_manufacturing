<div class="container" style="padding: 30px; max-width: 800px; margin: 0 auto;">
    <h2>Daily Material Planning</h2>
    <p>Generate Material Requests for stores — one per department WIP.</p>
    <hr>
    
    <div class="row">
        <div class="col-sm-6">
            <div class="form-group">
                <label>Production Plan</label>
                <select id="production_plan" class="form-control">
                    <option value="">Select Production Plan</option>
                </select>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="form-group">
                <label>Planned Start Date</label>
                <input type="date" id="planned_date" class="form-control" value="">
            </div>
        </div>
        <div class="col-sm-3">
            <br>
            <button id="generate_btn" class="btn btn-primary" onclick="generate()">Generate MRs</button>
        </div>
    </div>
    
    <div id="result" style="margin-top: 20px;"></div>
</div>

<script>
// Set today's date
document.getElementById('planned_date').value = new Date().toISOString().split('T')[0];

// Load Production Plans
frappe.call({
    method: 'tekson_manufacturing.www.mes.daily_material_planning.search_production_plans',
    args: {txt: ''},
    callback: function(r) {
        let select = document.getElementById('production_plan');
        (r.message || []).forEach(function(pp) {
            let opt = document.createElement('option');
            opt.value = pp.name;
            opt.text = pp.name + (pp.status ? ' [' + pp.status + ']' : '');
            select.appendChild(opt);
        });
    }
});

function generate() {
    let pp = document.getElementById('production_plan').value;
    let date = document.getElementById('planned_date').value;
    if (!pp) { frappe.msgprint('Please select a Production Plan'); return; }
    
    let btn = document.getElementById('generate_btn');
    btn.disabled = true;
    btn.innerHTML = 'Generating...';
    
    frappe.call({
        method: 'tekson_manufacturing.planning.material_planning_service.generate_daily_material_requests',
        args: { production_plan: pp, planned_date: date },
        callback: function(r) {
            btn.disabled = false;
            btn.innerHTML = 'Generate MRs';
            
            let res = r.message || {};
            let html = '';
            if (res.created_mrs && res.created_mrs.length > 0) {
                html += '<div class="alert alert-success"><b>' + res.created_mrs.length + '</b> MR(s) for <b>' + res.planned_date + '</b></div>';
                (res.details || []).forEach(function(d) {
                    html += '<div class="alert alert-info" style="margin:5px 0;">';
                    html += '<a href="/app/material-request/' + d.name + '"><b>' + d.name + '</b></a>';
                    html += ' — ' + d.department_wip + ' (' + d.items + ' items)';
                    html += '</div>';
                });
            } else {
                html += '<div class="alert alert-warning">' + (res.message || 'No materials needed') + '</div>';
            }
            document.getElementById('result').innerHTML = html;
        }
    });
}
</script>
